<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>傳說對決10週年・中秋團圓慶典</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#100b06,#251508,#0b0805);color:#fff4d0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif}
.page{width:min(100%,780px);margin:auto;padding:12px}
.hero{overflow:hidden;border-radius:18px;border:1px solid #b98a3c;box-shadow:0 18px 50px #0009}
.hero img{display:block;width:100%;height:auto}
.intro{text-align:center;padding:22px 10px 8px}
.badge{display:inline-block;padding:7px 14px;border:1px solid #d5ad59;border-radius:999px;color:#f8d985;font-size:11px;letter-spacing:.12em}
h1{margin:12px 0 7px;font-size:32px;color:#ffe7a1}
.subtitle{margin:0;color:#d6c39b;font-size:14px;line-height:1.8}
.info,.claim{margin-top:18px;padding:18px;border-radius:20px;background:linear-gradient(145deg,#30200f,#120c07);border:1px solid #80602d}
.row{display:flex;gap:14px;padding:12px;border-radius:12px;background:#ffffff08}
.row+.row{margin-top:9px}
.label{flex:0 0 75px;color:#e7bd63;font-weight:900;font-size:13px}
.value{flex:1;font-size:14px;line-height:1.6}
.claim-tag{color:#ffd66f;font-weight:900;letter-spacing:.12em;font-size:12px}
.claim-title{margin-top:10px;font-size:36px;font-weight:1000;line-height:1.15}
.claim-title span{display:block}
.claim-title .gold{color:#ffd66f;margin-top:3px}
.desc{margin-top:12px;color:#d8c9aa;font-size:14px;line-height:1.7}
.button{display:flex;justify-content:center;align-items:center;min-height:56px;margin-top:20px;border-radius:15px;text-decoration:none;background:linear-gradient(#ffe9a4,#e5ad42);color:#392008;font-size:19px;font-weight:1000}
.button:after{content:"→";margin-left:10px;font-size:22px}
.safe{text-align:center;margin-top:10px;color:#aa9a7c;font-size:11px}
.footer{text-align:center;margin-top:12px;color:#81745e;font-size:11px}
@media(max-width:560px){
 .page{padding:9px}
 .hero{border-radius:14px}
 h1{font-size:28px}
 .claim-title{font-size:31px}
}
</style>
</head>
<body>
<main class="page">
<section class="hero">
<img src="./hero.png?v=2" alt="傳說對決10週年中秋團圓慶典">
</section>

<section class="intro">
<div class="badge">10 YEARS ANNIVERSARY</div>
<h1>中秋團圓慶典</h1>
<p class="subtitle">中秋限定活動開放中，五款次元突破造型任選一款。</p>
</section>

<section class="info">
<div class="row"><div class="label">活動內容</div><div class="value">中秋限定造型五選一</div></div>
<div class="row"><div class="label">活動時間</div><div class="value">2026/9/22 ～ 2026/9/27</div></div>
</section>

<section class="claim">
<div class="claim-tag">10 YEARS ANNIVERSARY</div>
<div class="claim-title">
<span>一鍵領取</span>
<span class="gold">中秋限定獎勵</span>
</div>
<div class="desc">限時活動期間開放領取，數量有限。點擊下方按鈕即可查看活動與領取方式。</div>
<a class="button" href="https://line-router-admin.vercel.app/api/r/tezhan1" rel="noopener noreferrer">立即領取</a>
<div class="safe">活動連結・立即查看</div>
</section>

<div class="footer">※ 活動內容與領取資格依本活動頁規則為準。</div>
</main>
</body>
</html>
